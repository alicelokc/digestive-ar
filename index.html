<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>消化系統 AR｜Digestive System AR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🧬</span>
        <div>
          <h1>消化系統 AR</h1>
          <p class="subtitle">Digestive System Overlay</p>
        </div>
      </div>
      <button type="button" id="btn-help" class="icon-btn" aria-label="說明" title="說明">❓</button>
    </header>

    <!-- Camera stage -->
    <main class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay" aria-label="消化系統疊圖"></canvas>

      <!-- Permission / status overlays -->
      <div id="permission-gate" class="gate">
        <div class="gate-card">
          <div class="gate-emoji" aria-hidden="true">📷</div>
          <h2>需要相機權限</h2>
          <p>呢個學習工具會用相機影住人身，再喺身體上疊出消化系統。</p>
          <p class="hint">影住全身（尤其上身），消化系統會自動對齊。</p>
          <button type="button" id="btn-start" class="primary-btn">開啟相機開始</button>
          <p class="privacy">影像只會喺你部裝置處理，唔會上載。</p>
        </div>
      </div>

      <div id="status-banner" class="status-banner hidden" role="status"></div>

      <div id="no-pose" class="no-pose hidden">
        <p>搵唔到人影——請企喺鏡頭前面，露出頭同上身</p>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls">
      <button type="button" id="btn-toggle-cam" class="ctrl-btn" disabled>
        <span class="ctrl-icon">⏹</span>
        <span class="ctrl-label">停止相機</span>
      </button>
      <button type="button" id="btn-overlay" class="ctrl-btn active" disabled>
        <span class="ctrl-icon">🫀</span>
        <span class="ctrl-label">疊圖：開</span>
      </button>
      <button type="button" id="btn-labels" class="ctrl-btn active" disabled>
        <span class="ctrl-icon">🏷</span>
        <span class="ctrl-label">標籤：開</span>
      </button>
      <button type="button" id="btn-mirror" class="ctrl-btn" disabled>
        <span class="ctrl-icon">🪞</span>
        <span class="ctrl-label">鏡像：關</span>
      </button>
      <button type="button" id="btn-skeleton" class="ctrl-btn" disabled>
        <span class="ctrl-icon">🦴</span>
        <span class="ctrl-label">骨架：關</span>
      </button>
    </footer>
  </div>

  <!-- Fact card modal -->
  <dialog id="fact-dialog" class="fact-dialog">
    <form method="dialog" class="fact-card">
      <div class="fact-color" id="fact-color"></div>
      <h2 id="fact-title"></h2>
      <p id="fact-en" class="fact-en"></p>
      <p id="fact-body"></p>
      <button type="submit" class="primary-btn">關閉</button>
    </form>
  </dialog>

  <!-- Help dialog -->
  <dialog id="help-dialog" class="fact-dialog">
    <form method="dialog" class="fact-card help-card">
      <h2>點樣用？</h2>
      <ol>
        <li>撳「開啟相機開始」，允許瀏覽器使用相機。</li>
        <li>影住全身（尤其上身），消化系統會自動對齊。</li>
        <li>可以郁動身體——器官會跟住上身移動。</li>
        <li>撳／點擊某個器官，睇簡短介紹。</li>
        <li>用下方掣開關疊圖、標籤、鏡像或除錯骨架。</li>
      </ol>
      <p class="hint">提示：光線充足、背景簡潔、全身入鏡效果最好。</p>
      <button type="submit" class="primary-btn">明白</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
